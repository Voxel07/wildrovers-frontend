server {
    # The unprivileged nginx image cannot bind ports below 1024.
    listen 8080;
    server_name localhost;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; frame-src PLACEHOLDER_CSP_FRAME_SOURCES; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: PLACEHOLDER_CSP_IMG_SOURCES; font-src 'self' data:; connect-src 'self' PLACEHOLDER_CSP_CONNECT_SOURCES" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    root /usr/share/nginx/html;

    # Vite puts a content hash in every file name under /assets: cache them for good.
    # (expires sets Cache-Control itself, so the server-level add_header lines still apply.)
    # ^~ keeps the image rule below from matching hashed files in /assets.
    location ^~ /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Icons, share images and the manifest have no hash in their names: cache them for a week.
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|json|webmanifest|txt)$ {
        expires 7d;
        try_files $uri =404;
    }

    # The entry point must always be revalidated so new deployments are picked up.
    location = /index.html {
        expires -1;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
